version: 1

# This project contains an Amplify Gen 2 backend. Without this phase Amplify
# Hosting deploys only the Vite files and never creates ClassLineTable, the API
# Lambda, or Cognito resources.
backend:
  phases:
    build:
      commands:
        - nvm install 22
        - nvm use 22
        - npx --yes --package=npm@10.9.3 npm ci --include=dev --cache .npm --prefer-offline
        - npm run lint:backend
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    build:
      commands:
        - node scripts/configure-hosted-api.mjs
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
